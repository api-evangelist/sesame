aid: sesame
name: Sesame
description: Sesame is a direct-to-consumer telehealth marketplace that connects patients
  with board-certified clinicians for affordable, transparent, cash-pay virtual and in-person
  care. Patients browse and book pay-per-visit appointments starting around $34 across
  urgent care, prescription refills, weight loss and GLP-1 treatment, mental health, women's
  health, dermatology, pediatrics and more, with no insurance required and up-front pricing.
  The company also offers a SesamePlus membership, a mobile app, provider tooling for listing
  a practice, and Sesame @ Work employer plans. Sesame is backed by General Catalyst, GV,
  Matrix Partners, Redpoint Ventures, Spark Capital and SV Angel. As of this enrichment pass
  Sesame publishes a consumer web and mobile experience but no public developer API, developer
  portal, SDKs, or OpenAPI surface. It operates a private Apollo GraphQL endpoint at
  api.sesamecare.com/graphql that backs its own apps — anonymous requests return 401 and
  introspection is disabled in production — and its public GitHub organization publishes 17
  general-purpose Node/TypeScript utility packages under the @sesamecare-oss npm scope rather
  than first-party API client SDKs.
