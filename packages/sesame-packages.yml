note: >-
  Sesame publishes 17 first-party packages to npm under the @sesamecare-oss scope, mirrored
  from the verified github.com/sesamecare organization. IMPORTANT: none of these is an API
  client SDK. They are general-purpose Node/TypeScript infrastructure utilities Sesame
  open-sourced out of its own platform (distributed locks, Redis helpers, OpenTelemetry
  metrics, rate limiting, cursor pagination, rule DSLs, US postal-code lookup, prompt
  templating). Because no package wraps a Sesame API, this artifact deliberately carries NO
  `SDKs` pointer in apis.yml — the sdk_count ergonomics check measures client libraries for
  the provider's API, and crediting it here would assert a developer program Sesame does not
  run. Maven Central (g:com.sesamecare) returned 0 results and pypi.org/pypi/sesamecare/json
  returned 404, so the two Java repositories in the GitHub org are source-only.
